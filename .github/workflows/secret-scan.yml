name: Secret scan

on:
  push:
    branches: [main]
  pull_request:

# Cancel in-progress scans for the same PR/branch so pushes don't queue up.
concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: Scan for secrets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history is required so gitleaks can compare against the base
          # branch on pull requests and scan all new commits on pushes.
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
