name: Backend Deploy

# ─────────────────────────────────────────────────────────────────────────────
# Two-branch deployment model
#
#   main       → always deploys to staging and runs E2E smoke tests
#   production → always deploys to production (requires manual approval)
#
# Promoting staging → production:
#   git push origin main:production
#
# The local pre-push hook (installed by infra/scripts/setup-git-hooks.sh)
# verifies that staging is healthy before allowing the push to production.
# GitHub Actions then requires a manual approval (environment: production)
# before the deploy steps run.
# ─────────────────────────────────────────────────────────────────────────────

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - "backend/**"
      - "infra/**"
      - ".github/workflows/backend-deploy.yml"
  push:
    branches: [main, production]
    paths:
      - "backend/**"
      - "infra/**"
      - ".github/workflows/backend-deploy.yml"
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to deploy
        required: true
        type: choice
        options: [staging, prod]

permissions:
  contents: write   # needed for creating releases and tags
  packages: write

env:
  BACKEND_IMAGE_BASE: ghcr.io/tahniat-ashraf/jababdihi-backend

jobs:

  # ── 1. Build and test ────────────────────────────────────────────────────
  test:
    name: Build and test
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Spotless
        run: mvn -f backend/pom.xml spotless:check

      - name: Test
        run: mvn -f backend/pom.xml test

      - name: Package
        run: mvn -f backend/pom.xml package -DskipTests

  # ── 2. Build and push Docker image ──────────────────────────────────────
  build-image:
    name: Build backend image
    runs-on: ubuntu-latest
    needs: test
    outputs:
      image: ${{ steps.image.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN || github.token }}

      - name: Select image tag
        id: image
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            TAG="pr-${{ github.event.pull_request.number }}"
          else
            # Same SHA tag whether this runs on main or production —
            # both branches run the exact same image.
            TAG="${{ github.sha }}"
          fi
          echo "image=${BACKEND_IMAGE_BASE}:${TAG}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/Dockerfile
          push: true
          tags: |
            ${{ steps.image.outputs.image }}
            ${{ env.BACKEND_IMAGE_BASE }}:${{ github.sha }}

  # ── 3. Deploy to staging ─────────────────────────────────────────────────
  # Runs on every PR and every push to main.
  # Never runs on push to production branch.
  deploy-staging:
    name: Deploy staging
    runs-on: ubuntu-latest
    needs: build-image
    if: |
      github.ref_name != 'production' &&
      (
        github.event_name == 'pull_request' ||
        github.ref_name == 'main' ||
        (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'staging')
      )
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.STAGING_VPS_SSH_KEY }}

      - name: Trust VPS host
        run: ssh-keyscan -p 22 "${{ secrets.STAGING_VPS_HOST }}" >> ~/.ssh/known_hosts

      - name: Sync infra files
        run: |
          rsync -az --delete --exclude='.env*' -e "ssh -p 22" \
            infra/ "${{ secrets.STAGING_VPS_USER }}@${{ secrets.STAGING_VPS_HOST }}:${{ secrets.STAGING_DEPLOY_PATH }}/"

      - name: Run staging migrations and deploy
        timeout-minutes: 30
        run: |
          ssh -p 22 -o ServerAliveInterval=30 -o ServerAliveCountMax=40 \
            "${{ secrets.STAGING_VPS_USER }}@${{ secrets.STAGING_VPS_HOST }}" <<'SSH'
          set -eu
          cd "${{ secrets.STAGING_DEPLOY_PATH }}"
          echo "${{ secrets.GHCR_TOKEN || github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          export BACKEND_IMAGE="${{ needs.build-image.outputs.image }}"
          sed -i "s|^BACKEND_IMAGE=.*|BACKEND_IMAGE=${BACKEND_IMAGE}|" .env.staging
          docker pull "$BACKEND_IMAGE"
          docker compose --env-file .env.staging -f docker-compose.base.yml -f docker-compose.staging.yml up -d postgres
          echo "Waiting for postgres to be ready..."
          for i in $(seq 1 30); do
            docker compose --env-file .env.staging -f docker-compose.base.yml -f docker-compose.staging.yml exec -T postgres pg_isready && break
            echo "  attempt $i/30 — retrying in 2s"
            sleep 2
          done
          ./scripts/run-migrations.sh staging
          ./scripts/deploy-backend.sh staging "${{ needs.build-image.outputs.image }}"
          SSH

      - name: Verify staging health
        run: |
          echo "Checking staging health..."
          for i in $(seq 1 12); do
            if curl -fsS "http://${{ secrets.STAGING_VPS_HOST }}:8081/actuator/health" 2>/dev/null | grep -q '"UP"'; then
              echo "Staging is healthy."
              exit 0
            fi
            echo "  attempt $i/12 — retrying in 5s"
            sleep 5
          done
          echo "ERROR: Staging health check failed after 60s." >&2
          exit 1

  # ── 4. E2E smoke tests ───────────────────────────────────────────────────
  # Runs after every staging deploy.
  #
  # URL strategy:
  #   Pull requests  → Vercel branch-alias preview URL (Preview env vars
  #                    → staging BACKEND_API_BASE_URL). Derived automatically
  #                    from the branch name; no extra setup needed.
  #   Push to main   → vars.STAGING_FRONTEND_URL if set (a permanent staging
  #                    domain configured with Preview env vars, e.g.
  #                    https://staging.jababdihi.com).
  #                    Falls back to backend-only checks if not set.
  e2e-staging:
    name: Staging E2E smoke tests
    runs-on: ubuntu-latest
    needs: deploy-staging
    steps:
      - uses: actions/checkout@v4

      - name: Resolve staging frontend URL
        id: url
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            BRANCH="${{ github.head_ref }}"
            SLUG=$(echo "$BRANCH" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9]/-/g' | sed 's/-\+/-/g' | sed 's/^-//;s/-$//')
            URL="https://jababdihi-git-${SLUG}-${{ vars.VERCEL_TEAM_SLUG }}.vercel.app"
            echo "url=${URL}" >> "$GITHUB_OUTPUT"
            echo "run_playwright=true" >> "$GITHUB_OUTPUT"
          elif [[ -n "${{ vars.STAGING_FRONTEND_URL }}" ]]; then
            echo "url=${{ vars.STAGING_FRONTEND_URL }}" >> "$GITHUB_OUTPUT"
            echo "run_playwright=true" >> "$GITHUB_OUTPUT"
          else
            echo "url=" >> "$GITHUB_OUTPUT"
            echo "run_playwright=false" >> "$GITHUB_OUTPUT"
            echo "::notice::STAGING_FRONTEND_URL not set — running backend-only smoke tests."
            echo "::notice::To enable full Playwright E2E on main, set up staging.<domain> in Vercel"
            echo "::notice::(Preview env, staging backend) and add STAGING_FRONTEND_URL to GitHub variables."
          fi

      - name: Wait for Vercel preview to be ready
        if: steps.url.outputs.run_playwright == 'true'
        run: |
          URL="${{ steps.url.outputs.url }}"
          echo "Waiting for $URL ..."
          for i in $(seq 1 24); do
            STATUS=$(curl -o /dev/null -s -w "%{http_code}" "$URL" || true)
            if [ "$STATUS" = "200" ] || [ "$STATUS" = "304" ]; then
              echo "Frontend ready (HTTP $STATUS)."
              exit 0
            fi
            echo "  attempt $i/24 — HTTP $STATUS — retrying in 5s"
            sleep 5
          done
          echo "ERROR: Frontend did not become ready after 120s." >&2
          exit 1

      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.STAGING_VPS_SSH_KEY }}

      - name: Trust VPS host
        run: ssh-keyscan -p 22 "${{ secrets.STAGING_VPS_HOST }}" >> ~/.ssh/known_hosts

      - name: Seed staging data (idempotent)
        run: |
          ssh -p 22 -o ServerAliveInterval=30 -o ServerAliveCountMax=20 \
            "${{ secrets.STAGING_VPS_USER }}@${{ secrets.STAGING_VPS_HOST }}" <<'SSH'
          set -eu
          cd "${{ secrets.STAGING_DEPLOY_PATH }}"
          ./scripts/run-seed.sh staging
          SSH

      # ── Full Playwright E2E (when a staging frontend URL is available) ──
      - uses: actions/setup-node@v4
        if: steps.url.outputs.run_playwright == 'true'
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        if: steps.url.outputs.run_playwright == 'true'
        run: npm ci --prefix frontend

      - name: Install Playwright browsers
        if: steps.url.outputs.run_playwright == 'true'
        run: npx --prefix frontend playwright install --with-deps chromium

      - name: Run Playwright E2E smoke tests
        if: steps.url.outputs.run_playwright == 'true'
        run: npm run test:e2e:staging --prefix frontend
        env:
          STAGING_FRONTEND_URL: ${{ steps.url.outputs.url }}
          STAGING_API_BASE_URL: http://${{ secrets.STAGING_VPS_HOST }}:8081

      # ── Backend-only smoke test (fallback when no staging frontend URL) ──
      - name: Backend smoke test (API endpoints)
        if: steps.url.outputs.run_playwright == 'false'
        run: |
          BASE="http://${{ secrets.STAGING_VPS_HOST }}:8081"
          echo "Running backend-only smoke tests against $BASE ..."
          curl -fsS "$BASE/actuator/health" | grep -q '"UP"' && echo "  ✓ health"
          curl -fsS "$BASE/api/incidents?language=en&pageSize=1" | grep -q '"items"' && echo "  ✓ incidents"
          curl -fsS "$BASE/api/categories?language=en" | grep -q '"items"' && echo "  ✓ categories"
          curl -fsS "$BASE/api/actors?language=en" | grep -q '"items"' && echo "  ✓ actors"
          echo "Backend smoke tests passed."

      - name: Upload Playwright report
        if: failure() && steps.url.outputs.run_playwright == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-staging-report-${{ github.run_id }}
          path: frontend/playwright-report/
          retention-days: 7

  # ── 5. Deploy to production ───────────────────────────────────────────────
  # Triggered only by a push to the 'production' branch or workflow_dispatch.
  # Normal promotion path:
  #   git push origin main:production
  # The local pre-push hook verifies staging health before allowing this push.
  # GitHub then requires a manual approval (environment: production) before
  # the deploy steps run.
  deploy-production:
    name: Deploy production
    runs-on: ubuntu-latest
    needs: build-image
    if: |
      github.ref_name == 'production' ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'prod')
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history + all tags needed for semver bump logic

      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.PROD_VPS_SSH_KEY }}

      - name: Trust VPS host
        run: ssh-keyscan -p "${{ secrets.PROD_VPS_PORT || 22 }}" "${{ secrets.PROD_VPS_HOST }}" >> ~/.ssh/known_hosts

      - name: Sync infra files
        run: |
          rsync -az --delete --exclude='.env*' -e "ssh -p ${{ secrets.PROD_VPS_PORT || 22 }}" \
            infra/ "${{ secrets.PROD_VPS_USER }}@${{ secrets.PROD_VPS_HOST }}:${{ secrets.PROD_DEPLOY_PATH }}/"

      - name: Deploy production
        timeout-minutes: 20
        run: |
          # The image was built from the same SHA that was verified on staging.
          # pushing main:production ensures the SHA is identical.
          ssh -p "${{ secrets.PROD_VPS_PORT || 22 }}" -o ServerAliveInterval=30 -o ServerAliveCountMax=40 \
            "${{ secrets.PROD_VPS_USER }}@${{ secrets.PROD_VPS_HOST }}" <<'SSH'
          set -eu
          cd "${{ secrets.PROD_DEPLOY_PATH }}"
          echo "${{ secrets.GHCR_TOKEN || github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          BACKEND_IMAGE="${{ needs.build-image.outputs.image }}"
          IMAGE_TAG="${BACKEND_IMAGE##*:}"
          sed -i "s|^BACKEND_IMAGE=.*|BACKEND_IMAGE=${BACKEND_IMAGE}|" .env.prod
          docker pull "$BACKEND_IMAGE"
          ./scripts/deploy-prod.sh "$IMAGE_TAG"
          SSH

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # ── Semver bump logic ───────────────────────────────────────────
          # Follows https://semver.org  (MAJOR.MINOR.PATCH)
          #
          # Bump rules (conventional commits, checked against commits since
          # the last release tag):
          #
          #   MAJOR  — any commit with "BREAKING CHANGE" in the body/footer,
          #             or a "!" after the type  (e.g. feat!: ..., fix!: ...)
          #   MINOR  — any commit whose subject starts with "feat:"
          #   PATCH  — everything else (fix:, chore:, docs:, refactor:, …)
          #
          # First release ever → v1.0.0
          # ────────────────────────────────────────────────────────────────

          # Find the latest vX.Y.Z tag (sort by semver, pick the highest).
          LATEST_TAG=$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' \
            | sort -t. -k1,1V -k2,2n -k3,3n \
            | tail -1)

          if [ -z "$LATEST_TAG" ]; then
            NEW_TAG="v1.0.0"
            echo "No previous release found — starting at $NEW_TAG"
          else
            echo "Latest release tag: $LATEST_TAG"
            VERSION="${LATEST_TAG#v}"
            MAJOR=$(echo "$VERSION" | cut -d. -f1)
            MINOR=$(echo "$VERSION" | cut -d. -f2)
            PATCH=$(echo "$VERSION" | cut -d. -f3)

            # Collect commit subjects + bodies since the last release.
            COMMITS=$(git log "${LATEST_TAG}..HEAD" --pretty=format:"%s%n%b" 2>/dev/null || echo "")

            if echo "$COMMITS" | grep -qE "(BREAKING[[:space:]]CHANGE|^(feat|fix|chore|docs|refactor|perf|test|ci|build)!:)"; then
              NEW_TAG="v$((MAJOR + 1)).0.0"
              BUMP="MAJOR"
            elif echo "$COMMITS" | grep -qE "^feat(\([^)]+\))?:"; then
              NEW_TAG="v${MAJOR}.$((MINOR + 1)).0"
              BUMP="MINOR"
            else
              NEW_TAG="v${MAJOR}.${MINOR}.$((PATCH + 1))"
              BUMP="PATCH"
            fi

            echo "Bump type: $BUMP  →  $LATEST_TAG → $NEW_TAG"
          fi

          echo "Creating release $NEW_TAG ..."
          gh release create "$NEW_TAG" \
            --repo "${{ github.repository }}" \
            --title "$NEW_TAG" \
            --generate-notes \
            --latest \
            --target "${{ github.sha }}"
          echo "Release created: https://github.com/${{ github.repository }}/releases/tag/${NEW_TAG}"
