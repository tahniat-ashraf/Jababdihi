name: Backend Deploy

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - "backend/**"
      - "infra/**"
      - ".github/workflows/backend-deploy.yml"
  push:
    branches: [staging, main]
    paths:
      - "backend/**"
      - "infra/**"
      - ".github/workflows/backend-deploy.yml"
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to deploy
        required: true
        type: choice
        options: [staging, prod]

permissions:
  contents: read
  packages: write

env:
  BACKEND_IMAGE_BASE: ghcr.io/tahniat-ashraf/jababdihi-backend

jobs:
  build-image:
    name: Build backend image
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    outputs:
      image: ${{ steps.image.outputs.image }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN || github.token }}

      - name: Select image tag
        id: image
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            TAG="pr-${{ github.event.pull_request.number }}"
          elif [[ "${{ github.ref_name }}" == "main" || "${{ github.event.inputs.environment }}" == "prod" ]]; then
            TAG="prod-${{ github.sha }}"
          else
            TAG="staging-${{ github.sha }}"
          fi
          echo "image=${BACKEND_IMAGE_BASE}:${TAG}" >> "$GITHUB_OUTPUT"

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/Dockerfile
          push: true
          tags: |
            ${{ steps.image.outputs.image }}
            ${{ env.BACKEND_IMAGE_BASE }}:${{ github.sha }}

  deploy-staging:
    name: Deploy staging
    runs-on: ubuntu-latest
    needs: build-image
    if: github.ref_name == 'staging' || github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'staging')
    environment: staging
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.STAGING_VPS_SSH_KEY }}

      - name: Trust VPS host
        run: ssh-keyscan -p "${{ secrets.STAGING_VPS_PORT || 22 }}" "${{ secrets.STAGING_VPS_HOST }}" >> ~/.ssh/known_hosts

      - name: Sync infra files
        run: |
          rsync -az --delete --exclude='.env*' -e "ssh -p ${{ secrets.STAGING_VPS_PORT || 22 }}" \
            infra/ "${{ secrets.STAGING_VPS_USER }}@${{ secrets.STAGING_VPS_HOST }}:${{ secrets.STAGING_DEPLOY_PATH }}/"

      - name: Run staging migrations and deploy
        run: |
          ssh -p "${{ secrets.STAGING_VPS_PORT || 22 }}" "${{ secrets.STAGING_VPS_USER }}@${{ secrets.STAGING_VPS_HOST }}" <<'SSH'
          set -eu
          cd "${{ secrets.STAGING_DEPLOY_PATH }}"
          echo "${{ secrets.GHCR_TOKEN || github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          export BACKEND_IMAGE="${{ needs.build-image.outputs.image }}"
          docker compose --env-file .env -f docker-compose.base.yml -f docker-compose.staging.yml up -d postgres
          docker compose --env-file .env -f docker-compose.base.yml -f docker-compose.staging.yml wait postgres || true
          ./scripts/run-migrations.sh staging
          ./scripts/deploy-backend.sh staging "${{ needs.build-image.outputs.image }}"
          SSH

  production-migrations:
    name: Approve and run production migrations
    runs-on: ubuntu-latest
    needs: build-image
    if: github.ref_name == 'main' || (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'prod')
    environment: production-migrations
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.PROD_VPS_SSH_KEY }}

      - name: Trust VPS host
        run: ssh-keyscan -p "${{ secrets.PROD_VPS_PORT || 22 }}" "${{ secrets.PROD_VPS_HOST }}" >> ~/.ssh/known_hosts

      - name: Sync infra files
        run: |
          rsync -az --delete --exclude='.env*' -e "ssh -p ${{ secrets.PROD_VPS_PORT || 22 }}" \
            infra/ "${{ secrets.PROD_VPS_USER }}@${{ secrets.PROD_VPS_HOST }}:${{ secrets.PROD_DEPLOY_PATH }}/"

      - name: Run production migrations
        run: |
          ssh -p "${{ secrets.PROD_VPS_PORT || 22 }}" "${{ secrets.PROD_VPS_USER }}@${{ secrets.PROD_VPS_HOST }}" <<'SSH'
          set -eu
          cd "${{ secrets.PROD_DEPLOY_PATH }}"
          echo "${{ secrets.GHCR_TOKEN || github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          export BACKEND_IMAGE="${{ needs.build-image.outputs.image }}"
          ./scripts/run-migrations.sh prod
          SSH

  deploy-production:
    name: Deploy production
    runs-on: ubuntu-latest
    needs: [build-image, production-migrations]
    if: github.ref_name == 'main' || (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'prod')
    environment: production
    steps:
      - name: Install SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.PROD_VPS_SSH_KEY }}

      - name: Trust VPS host
        run: ssh-keyscan -p "${{ secrets.PROD_VPS_PORT || 22 }}" "${{ secrets.PROD_VPS_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy production
        run: |
          ssh -p "${{ secrets.PROD_VPS_PORT || 22 }}" "${{ secrets.PROD_VPS_USER }}@${{ secrets.PROD_VPS_HOST }}" <<'SSH'
          set -eu
          cd "${{ secrets.PROD_DEPLOY_PATH }}"
          echo "${{ secrets.GHCR_TOKEN || github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          ./scripts/deploy-backend.sh prod "${{ needs.build-image.outputs.image }}"
          SSH
