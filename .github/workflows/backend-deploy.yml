name: Backend Deploy

# ─────────────────────────────────────────────────────────────────────────────
# Deployment pipeline — guaranteed flow:
#
#   test → build-image → deploy-staging → e2e-staging → [approval] → deploy-production
#
# Production is never deployed before staging has been verified.
# The "production" GitHub environment requires a manual approval after e2e-staging passes.
# ─────────────────────────────────────────────────────────────────────────────

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - "backend/**"
      - "infra/**"
      - ".github/workflows/backend-deploy.yml"
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "infra/**"
      - ".github/workflows/backend-deploy.yml"
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to deploy
        required: true
        type: choice
        options: [staging, prod]

permissions:
  contents: read
  packages: write

env:
  BACKEND_IMAGE_BASE: ghcr.io/tahniat-ashraf/jababdihi-backend

jobs:

  # ── 1. Unit tests + build ────────────────────────────────────────────────
  test:
    name: Build and test
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Spotless
        run: mvn -f backend/pom.xml spotless:check

      - name: Test
        run: mvn -f backend/pom.xml test

      - name: Package
        run: mvn -f backend/pom.xml package -DskipTests

  # ── 2. Build & push Docker image ─────────────────────────────────────────
  build-image:
    name: Build backend image
    runs-on: ubuntu-latest
    needs: test
    outputs:
      image: ${{ steps.image.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN || github.token }}

      - name: Select image tag
        id: image
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            TAG="pr-${{ github.event.pull_request.number }}"
          else
            # Same tag for staging AND production — both environments run the
            # exact same image.  "prod" prefix is gone; we don't know at build
            # time whether the image will pass staging, so don't label it prod.
            TAG="${{ github.sha }}"
          fi
          echo "image=${BACKEND_IMAGE_BASE}:${TAG}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/Dockerfile
          push: true
          tags: |
            ${{ steps.image.outputs.image }}
            ${{ env.BACKEND_IMAGE_BASE }}:${{ github.sha }}

  # ── 3. Deploy to staging ─────────────────────────────────────────────────
  # Runs for every trigger: PRs, push to main, and manual dispatches.
  # Production is never deployed before this job succeeds.
  deploy-staging:
    name: Deploy staging
    runs-on: ubuntu-latest
    needs: build-image
    environment: staging
    # Skipped only when a PR comes from a fork (no access to secrets).
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4

      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.STAGING_VPS_SSH_KEY }}

      - name: Trust VPS host
        run: ssh-keyscan -p 22 "${{ secrets.STAGING_VPS_HOST }}" >> ~/.ssh/known_hosts

      - name: Sync infra files
        run: |
          rsync -az --delete --exclude='.env*' -e "ssh -p 22" \
            infra/ "${{ secrets.STAGING_VPS_USER }}@${{ secrets.STAGING_VPS_HOST }}:${{ secrets.STAGING_DEPLOY_PATH }}/"

      - name: Run staging migrations and deploy
        timeout-minutes: 30
        run: |
          ssh -p 22 -o ServerAliveInterval=30 -o ServerAliveCountMax=40 \
            "${{ secrets.STAGING_VPS_USER }}@${{ secrets.STAGING_VPS_HOST }}" <<'SSH'
          set -eu
          cd "${{ secrets.STAGING_DEPLOY_PATH }}"
          echo "${{ secrets.GHCR_TOKEN || github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          export BACKEND_IMAGE="${{ needs.build-image.outputs.image }}"
          sed -i "s|^BACKEND_IMAGE=.*|BACKEND_IMAGE=${BACKEND_IMAGE}|" .env.staging
          docker pull "$BACKEND_IMAGE"
          docker compose --env-file .env.staging -f docker-compose.base.yml -f docker-compose.staging.yml up -d postgres
          echo "Waiting for postgres to be ready..."
          for i in $(seq 1 30); do
            docker compose --env-file .env.staging -f docker-compose.base.yml -f docker-compose.staging.yml exec -T postgres pg_isready && break
            echo "  attempt $i/30 — retrying in 2s"
            sleep 2
          done
          ./scripts/run-migrations.sh staging
          ./scripts/deploy-backend.sh staging "${{ needs.build-image.outputs.image }}"
          SSH

      - name: Verify staging health
        run: |
          echo "Checking staging health..."
          for i in $(seq 1 12); do
            if curl -fsS "http://${{ secrets.STAGING_VPS_HOST }}:8081/actuator/health" 2>/dev/null | grep -q '"UP"'; then
              echo "Staging is healthy."
              exit 0
            fi
            echo "  attempt $i/12 — retrying in 5s"
            sleep 5
          done
          echo "ERROR: Staging health check failed after 60s." >&2
          exit 1

  # ── 4. E2E smoke tests against staging ───────────────────────────────────
  # Runs after every staging deploy.  Uses Playwright to test the full stack:
  # frontend (Vercel) → Next.js proxy → staging backend.
  #
  # URL strategy:
  #   - Pull requests:  Vercel branch-alias preview URL (auto-derived from branch
  #                     name; uses Preview env vars → staging BACKEND_API_BASE_URL).
  #   - Push to main:   vars.STAGING_FRONTEND_URL (a permanent staging domain, e.g.
  #                     https://staging.jababdihi.com, configured in Vercel with
  #                     Preview env vars so it proxies to the staging VPS).
  #
  # Setup required for push-to-main E2E:
  #   1. In Vercel: add staging.jababdihi.com as a custom domain on the main branch,
  #      using the Preview environment (not Production).  This ensures
  #      BACKEND_API_BASE_URL points to the staging VPS, not the prod API.
  #   2. In GitHub: set vars.STAGING_FRONTEND_URL = https://staging.jababdihi.com
  #
  # If STAGING_FRONTEND_URL is not set, this job fails and blocks production —
  # by design, since production must not deploy without verified staging.
  e2e-staging:
    name: Staging E2E smoke tests
    runs-on: ubuntu-latest
    needs: deploy-staging
    if: needs.deploy-staging.result == 'success'
    steps:
      - uses: actions/checkout@v4

      - name: Resolve staging frontend URL
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            # Branch-alias URL: Vercel creates a stable alias per branch that
            # always uses Preview env vars (BACKEND_API_BASE_URL → staging VPS).
            BRANCH="${{ github.head_ref }}"
            SLUG=$(echo "$BRANCH" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9]/-/g' | sed 's/-\+/-/g' | sed 's/^-//;s/-$//')
            TEAM_SLUG="${{ vars.VERCEL_TEAM_SLUG }}"
            URL="https://jababdihi-git-${SLUG}-${TEAM_SLUG}.vercel.app"
            echo "PR mode — derived URL: $URL"
          else
            # Push to main (or workflow_dispatch): must use the static staging domain.
            # This domain is configured in Vercel with Preview environment variables
            # so that BACKEND_API_BASE_URL points to the staging VPS, not production.
            URL="${{ vars.STAGING_FRONTEND_URL }}"
            if [[ -z "$URL" ]]; then
              echo "::error::STAGING_FRONTEND_URL repository variable is not set."
              echo "::error::E2E tests cannot run against the staging frontend on push-to-main."
              echo "::error::Set up staging.jababdihi.com in Vercel (Preview env) and add"
              echo "::error::STAGING_FRONTEND_URL=https://staging.jababdihi.com to GitHub"
              echo "::error::repository variables (Settings → Secrets and variables → Variables)."
              exit 1
            fi
            echo "Main/dispatch mode — using static URL: $URL"
          fi
          echo "STAGING_FRONTEND_URL=${URL}" >> "$GITHUB_ENV"

      - name: Wait for frontend to be ready
        run: |
          echo "Waiting for $STAGING_FRONTEND_URL ..."
          for i in $(seq 1 24); do
            STATUS=$(curl -o /dev/null -s -w "%{http_code}" "$STAGING_FRONTEND_URL" || true)
            if [ "$STATUS" = "200" ] || [ "$STATUS" = "304" ]; then
              echo "Frontend is ready (HTTP $STATUS)."
              exit 0
            fi
            echo "  attempt $i/24 — HTTP $STATUS — retrying in 5s"
            sleep 5
          done
          echo "ERROR: Frontend did not become ready after 120s." >&2
          exit 1

      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.STAGING_VPS_SSH_KEY }}

      - name: Trust VPS host
        run: ssh-keyscan -p 22 "${{ secrets.STAGING_VPS_HOST }}" >> ~/.ssh/known_hosts

      - name: Seed staging data (idempotent)
        run: |
          ssh -p 22 -o ServerAliveInterval=30 -o ServerAliveCountMax=20 \
            "${{ secrets.STAGING_VPS_USER }}@${{ secrets.STAGING_VPS_HOST }}" <<'SSH'
          set -eu
          cd "${{ secrets.STAGING_DEPLOY_PATH }}"
          ./scripts/run-seed.sh staging
          SSH

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Install Playwright browsers
        run: npx --prefix frontend playwright install --with-deps chromium

      - name: Run E2E smoke tests
        run: npm run test:e2e:staging --prefix frontend
        env:
          STAGING_API_BASE_URL: http://${{ secrets.STAGING_VPS_HOST }}:8081

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-staging-report-${{ github.run_id }}
          path: frontend/playwright-report/
          retention-days: 7

  # ── 5. Deploy to production ───────────────────────────────────────────────
  # Only reachable after e2e-staging passes.  Requires a manual approval in
  # the "production" GitHub environment before the deploy steps execute.
  # To approve: Actions → this workflow run → Review deployments → Approve.
  #
  # build-image is listed in needs (alongside e2e-staging) so that its outputs
  # (image name) are accessible here.  e2e-staging already depends on
  # build-image transitively, so listing both causes no extra waiting.
  deploy-production:
    name: Deploy production
    runs-on: ubuntu-latest
    needs: [build-image, e2e-staging]
    # always() lets this job evaluate its own if-condition even when an
    # upstream job is skipped (e.g. on a PR where production must not run).
    # The explicit result checks are the real gate.
    if: |
      always() &&
      needs.build-image.result == 'success' &&
      needs.e2e-staging.result == 'success' &&
      (
        github.ref_name == 'main' ||
        (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'prod')
      )
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.PROD_VPS_SSH_KEY }}

      - name: Trust VPS host
        run: ssh-keyscan -p "${{ secrets.PROD_VPS_PORT || 22 }}" "${{ secrets.PROD_VPS_HOST }}" >> ~/.ssh/known_hosts

      - name: Sync infra files
        run: |
          rsync -az --delete --exclude='.env*' -e "ssh -p ${{ secrets.PROD_VPS_PORT || 22 }}" \
            infra/ "${{ secrets.PROD_VPS_USER }}@${{ secrets.PROD_VPS_HOST }}:${{ secrets.PROD_DEPLOY_PATH }}/"

      - name: Deploy production
        timeout-minutes: 20
        run: |
          # The image was built once, deployed to staging, verified by E2E —
          # now deploy the exact same image to production.
          ssh -p "${{ secrets.PROD_VPS_PORT || 22 }}" -o ServerAliveInterval=30 -o ServerAliveCountMax=40 \
            "${{ secrets.PROD_VPS_USER }}@${{ secrets.PROD_VPS_HOST }}" <<'SSH'
          set -eu
          cd "${{ secrets.PROD_DEPLOY_PATH }}"
          echo "${{ secrets.GHCR_TOKEN || github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          BACKEND_IMAGE="${{ needs.build-image.outputs.image }}"
          IMAGE_TAG="${BACKEND_IMAGE##*:}"
          sed -i "s|^BACKEND_IMAGE=.*|BACKEND_IMAGE=${BACKEND_IMAGE}|" .env.prod
          docker pull "$BACKEND_IMAGE"
          ./scripts/deploy-prod.sh "$IMAGE_TAG"
          SSH
