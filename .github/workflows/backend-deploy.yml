name: Backend Deploy

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - "backend/**"
      - "infra/**"
      - ".github/workflows/backend-deploy.yml"
  push:
    branches: [staging, main]
    paths:
      - "backend/**"
      - "infra/**"
      - ".github/workflows/backend-deploy.yml"
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to deploy
        required: true
        type: choice
        options: [staging, prod]

permissions:
  contents: read
  packages: write

env:
  BACKEND_IMAGE_BASE: ghcr.io/tahniat-ashraf/jababdihi-backend

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Spotless
        run: mvn -f backend/pom.xml spotless:check

      - name: Test
        run: mvn -f backend/pom.xml test

      - name: Package
        run: mvn -f backend/pom.xml package -DskipTests

  build-image:
    name: Build backend image
    runs-on: ubuntu-latest
    needs: test
    outputs:
      image: ${{ steps.image.outputs.image }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN || github.token }}

      - name: Select image tag
        id: image
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            TAG="pr-${{ github.event.pull_request.number }}"
          elif [[ "${{ github.ref_name }}" == "main" || "${{ github.event.inputs.environment }}" == "prod" ]]; then
            TAG="prod-${{ github.sha }}"
          else
            TAG="staging-${{ github.sha }}"
          fi
          echo "image=${BACKEND_IMAGE_BASE}:${TAG}" >> "$GITHUB_OUTPUT"

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/Dockerfile
          push: true
          tags: |
            ${{ steps.image.outputs.image }}
            ${{ env.BACKEND_IMAGE_BASE }}:${{ github.sha }}

  deploy-staging:
    name: Deploy staging
    runs-on: ubuntu-latest
    needs: build-image
    if: github.ref_name == 'staging' || github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'staging')
    environment: staging
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.STAGING_VPS_SSH_KEY }}

      - name: Trust VPS host
        run: ssh-keyscan -p 22 "${{ secrets.STAGING_VPS_HOST }}" >> ~/.ssh/known_hosts

      - name: Sync infra files
        run: |
          rsync -az --delete --exclude='.env*' -e "ssh -p 22" \
            infra/ "${{ secrets.STAGING_VPS_USER }}@${{ secrets.STAGING_VPS_HOST }}:${{ secrets.STAGING_DEPLOY_PATH }}/"

      - name: Run staging migrations and deploy
        timeout-minutes: 30
        run: |
          ssh -p 22 -o ServerAliveInterval=30 -o ServerAliveCountMax=40 "${{ secrets.STAGING_VPS_USER }}@${{ secrets.STAGING_VPS_HOST }}" <<'SSH'
          set -eu
          cd "${{ secrets.STAGING_DEPLOY_PATH }}"
          echo "${{ secrets.GHCR_TOKEN || github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          export BACKEND_IMAGE="${{ needs.build-image.outputs.image }}"
          sed -i "s|^BACKEND_IMAGE=.*|BACKEND_IMAGE=${BACKEND_IMAGE}|" .env.staging
          docker pull "$BACKEND_IMAGE"
          docker compose --env-file .env.staging -f docker-compose.base.yml -f docker-compose.staging.yml up -d postgres
          echo "Waiting for postgres to be ready..."
          for i in $(seq 1 30); do
            docker compose --env-file .env.staging -f docker-compose.base.yml -f docker-compose.staging.yml exec -T postgres pg_isready && break
            echo "  attempt $i/30 — retrying in 2s"
            sleep 2
          done
          ./scripts/run-migrations.sh staging
          ./scripts/deploy-backend.sh staging "${{ needs.build-image.outputs.image }}"
          SSH

      - name: Verify staging health
        run: |
          echo "Checking staging health..."
          for i in $(seq 1 12); do
            if curl -fsS "http://${{ secrets.STAGING_VPS_HOST }}:8081/actuator/health" 2>/dev/null | grep -q '"UP"'; then
              echo "Staging is healthy."
              exit 0
            fi
            echo "  attempt $i/12 — retrying in 5s"
            sleep 5
          done
          echo "ERROR: Staging health check failed after 60s." >&2
          exit 1

  e2e-staging:
    name: Staging E2E smoke tests
    runs-on: ubuntu-latest
    needs: deploy-staging
    if: |
      (github.ref_name == 'staging' || github.event_name == 'pull_request' ||
       (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'staging')) &&
      vars.STAGING_FRONTEND_URL != ''
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.STAGING_VPS_SSH_KEY }}

      - name: Trust VPS host
        run: ssh-keyscan -p 22 "${{ secrets.STAGING_VPS_HOST }}" >> ~/.ssh/known_hosts

      - name: Seed staging data (idempotent)
        run: |
          ssh -p 22 -o ServerAliveInterval=30 -o ServerAliveCountMax=20 "${{ secrets.STAGING_VPS_USER }}@${{ secrets.STAGING_VPS_HOST }}" <<'SSH'
          set -eu
          cd "${{ secrets.STAGING_DEPLOY_PATH }}"
          ./scripts/run-seed.sh staging
          SSH

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Install Playwright browsers
        run: npx --prefix frontend playwright install --with-deps chromium

      - name: Run staging E2E
        run: npm run test:e2e:staging --prefix frontend
        env:
          STAGING_FRONTEND_URL: ${{ vars.STAGING_FRONTEND_URL }}
          STAGING_API_BASE_URL: http://${{ secrets.STAGING_VPS_HOST }}:8081

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-staging-report-${{ github.run_id }}
          path: frontend/playwright-report/
          retention-days: 7

  deploy-production:
    name: Deploy production
    runs-on: ubuntu-latest
    needs: build-image
    if: github.ref_name == 'main' || (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'prod')
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.PROD_VPS_SSH_KEY }}

      - name: Trust VPS host
        run: ssh-keyscan -p "${{ secrets.PROD_VPS_PORT || 22 }}" "${{ secrets.PROD_VPS_HOST }}" >> ~/.ssh/known_hosts

      - name: Sync infra files
        run: |
          rsync -az --delete --exclude='.env*' -e "ssh -p ${{ secrets.PROD_VPS_PORT || 22 }}" \
            infra/ "${{ secrets.PROD_VPS_USER }}@${{ secrets.PROD_VPS_HOST }}:${{ secrets.PROD_DEPLOY_PATH }}/"

      - name: Deploy production
        timeout-minutes: 20
        run: |
          ssh -p "${{ secrets.PROD_VPS_PORT || 22 }}" -o ServerAliveInterval=30 -o ServerAliveCountMax=40 "${{ secrets.PROD_VPS_USER }}@${{ secrets.PROD_VPS_HOST }}" <<'SSH'
          set -eu
          cd "${{ secrets.PROD_DEPLOY_PATH }}"
          echo "${{ secrets.GHCR_TOKEN || github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          BACKEND_IMAGE="${{ needs.build-image.outputs.image }}"
          IMAGE_TAG="${BACKEND_IMAGE##*:}"
          sed -i "s|^BACKEND_IMAGE=.*|BACKEND_IMAGE=${BACKEND_IMAGE}|" .env.prod
          docker pull "$BACKEND_IMAGE"
          ./scripts/deploy-prod.sh "$IMAGE_TAG"
          SSH
