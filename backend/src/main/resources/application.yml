app:
  admin:
    api-key: dev-api-key

spring:
  application:
    name: jababdihi-backend
  profiles:
    default: api
  data:
    redis:
      repositories:
        enabled: false
  quartz:
    auto-startup: false

management:
  endpoints:
    web:
      exposure:
        include: health,metrics
  endpoint:
    health:
      probes:
        enabled: true
  health:
    redis:
      enabled: false
