# Rate-limiting zones — loaded at http context level.
#
# Included automatically by /etc/nginx/nginx.conf via:
#   include /etc/nginx/conf.d/*.conf;
#
# 00- prefix ensures this file loads before default.conf so the zones are
# defined before the server block tries to reference them.

# 10 MB shared memory ≈ 160 000 tracked IPs (binary_remote_addr = 4–16 bytes).
# Cloudflare sits in front in production, so $binary_remote_addr is the
# Cloudflare edge IP unless real_ip is configured.  If you configure
# set_real_ip_from (see below), swap to the visitor's real IP here.

# /api/ endpoints: 60 requests per minute per IP
# (1 req/s average; burst allows a quick page-load flurry)
limit_req_zone  $binary_remote_addr  zone=api_zone:10m    rate=60r/m;

# Health endpoint: generous limit for monitoring tools
limit_req_zone  $binary_remote_addr  zone=health_zone:1m  rate=30r/m;

# Concurrent connection cap per IP (prevents slow-loris style attacks)
limit_conn_zone $binary_remote_addr  zone=conn_zone:10m;

# Return 429 Too Many Requests (instead of default 503) so clients can
# back off and retry.
limit_req_status  429;
limit_conn_status 429;
